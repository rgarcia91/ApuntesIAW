<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo de Método GET con Parámetro</title>
</head>
<body>
    <h1>Ejemplo de Método GET con Parámetro</h1>
    <label for="idInput">ID:</label>
    <input type="number" id="idInput" value="1">
    <button id="fetchData">Obtener Datos</button>
    <pre id="result"></pre>

    <script>
        document.getElementById('fetchData').addEventListener('click', function() {
            const id = document.getElementById('idInput').value;
            const xhr = new XMLHttpRequest();
            xhr.open('GET', `data.json?id=${id}`, true);
            xhr.onload = function() {
                if (xhr.status === 200) {
                    const data = JSON.parse(xhr.responseText);
                    const result = data.find(item => item.id == id);
                    if (result) {
                        document.getElementById('result').innerText = JSON.stringify(result, null, 2);
                    } else {
                        document.getElementById('result').innerText = 'No se encontraron datos para el ID proporcionado.';
                    }
                } else {
                    console.error('Error al obtener los datos:', xhr.statusText);
                }
            };
            xhr.onerror = function() {
                console.error('Error de red');
            };
            xhr.send();
        });
    </script>
</body>
</html>
