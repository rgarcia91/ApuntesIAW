
version: '3'

services:
  nginx:
    image: nginx:latest
    ports:
      - "8080:80"
    depends_on:
      - apache1
      - apache2
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    networks:
      - webnet

  apache1:
    image: httpd:latest
    networks:
      - webnet

  apache2:
    image: httpd:latest
    networks:
      - webnet

networks:
  webnet:
    driver: bridge
